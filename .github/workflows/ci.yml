name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows is not an afterthought here, it is where the hard problems live:
    # resolving npm script shims to what they actually run, containing a process
    # tree with a Job Object, and restoring the environment variables a packaged
    # host fails to pass on. Every one of those has already been a real bug.
    # Testing only on Linux means the tests covering them are skipped — green
    # because they never ran.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # The steps below are shell scripts. GitHub's Windows runners default to
        # PowerShell, which does not speak this dialect; asking for bash keeps
        # one definition of each step across both platforms.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Smoke test (mock agent, end-to-end over MCP stdio)
        run: |
          # Windows will not execute an extensionless file, and Go's launcher
          # resolution will not find one either.
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          go build -o "cli-agent-mcp$exe" .
          go run ./cmd/smoketest "./cli-agent-mcp$exe"
