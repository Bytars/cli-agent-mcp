name: release

# Push a version tag to cut a release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds binaries for every platform (incl. the Windows .exe), generates
# checksums, and publishes a GitHub Release with auto-generated changelog notes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  # Build provenance: id-token signs the attestation, attestations stores it.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      # setup-go v6 onwards exports GOTOOLCHAIN=local, so the Go it installs is
      # the Go that builds — no silent download of a newer toolchain because
      # some module asked for one. That is what you want from a release path,
      # but it turns a version mismatch into a hard failure instead of a
      # transparent upgrade. If a build here ever stops with "go.mod requires
      # go >= X (running Y; GOTOOLCHAIN=local)", the fix is to raise the `go`
      # directive in go.mod, which is what this step reads its version from.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Building cli-agent-mcp ${VERSION}"
          mkdir -p dist
          # Windows executables carry no publisher information unless a VERSIONINFO
          # resource is embedded, which leaves Explorer and the SmartScreen prompt
          # showing a blank company. go-winres compiles winres/winres.json into
          # rsrc_windows_<arch>.syso; Go's linker picks those up automatically for
          # GOOS=windows only, so the other targets are unaffected.
          # `go run` rather than `go install`, so this does not depend on
          # GOPATH/bin being on PATH; pinned rather than @latest, because this
          # runs in the release path.
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64 \
            --file-version "${VERSION}" --product-version "${VERSION}"
          targets="windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/cli-agent-mcp_${os}_${arch}${ext}"
            echo "  -> $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          done
          ( cd dist && sha256sum * > checksums.txt )
          ls -lh dist

      # Cryptographic proof of where these binaries came from: which commit, which
      # workflow, which runner. Free, and verifiable by anyone with
      #   gh attest verify cli-agent-mcp_windows_amd64.exe --repo Bytars/cli-agent-mcp
      # This is not code signing and does not affect SmartScreen — it is the
      # supply-chain answer, not the "unknown publisher" one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/cli-agent-mcp_*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # LICENSE and NOTICE ride along with every release: Apache-2.0 §4
          # requires anyone redistributing these binaries to carry them, and
          # fail_on_unmatched_files means a release cannot go out without them.
          files: |
            dist/cli-agent-mcp_*
            dist/checksums.txt
            LICENSE
            NOTICE
